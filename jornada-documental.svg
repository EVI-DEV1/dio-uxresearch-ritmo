<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610" viewBox="0 0 1500 610"><title>Ritmo — jornada documental proposta</title><rect width="1500" height="610" fill="#F7F5F0"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="32" fill="#203D37" font-weight="700">Ritmo / jornada documental</text><text x="40" y="93" font-family="Arial, sans-serif" font-size="18" fill="#203D37" font-weight="400">Reconstrução analítica de documentos distintos; não é uma sessão observada.</text><rect x="40" y="140" width="270" height="350" rx="16" fill="white" stroke="#D5DED7"/><text x="58" y="180" font-family="Arial, sans-serif" font-size="23" fill="#203D37" font-weight="700">01 / Preparar</text><text x="58" y="218" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E01 · E06 · E09</text><text x="58" y="262" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Reunir tarefas e</text><text x="58" y="288" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">compromissos.</text><text x="58" y="361" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="700">Hipótese de oportunidade</text><text x="58" y="398" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Lista curta e calendário</text><text x="58" y="424" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">opcional.</text><rect x="330" y="140" width="270" height="350" rx="16" fill="white" stroke="#D5DED7"/><text x="348" y="180" font-family="Arial, sans-serif" font-size="23" fill="#203D37" font-weight="700">02 / Escolher</text><text x="348" y="218" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E02 · E08</text><text x="348" y="262" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Reservar bloco ou seguir</text><text x="348" y="288" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">uma sequência.</text><text x="348" y="361" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="700">Hipótese de oportunidade</text><text x="348" y="398" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Próxima atividade e</text><text x="348" y="424" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">escopo visíveis.</text><rect x="620" y="140" width="270" height="350" rx="16" fill="white" stroke="#D5DED7"/><text x="638" y="180" font-family="Arial, sans-serif" font-size="23" fill="#203D37" font-weight="700">03 / Executar</text><text x="638" y="218" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E02 · E10</text><text x="638" y="262" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Trabalhar em partes e</text><text x="638" y="288" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">registrar avanço.</text><text x="638" y="361" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="700">Hipótese de oportunidade</text><text x="638" y="398" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Passos claros e conclusão</text><text x="638" y="424" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">confirmada.</text><rect x="910" y="140" width="270" height="350" rx="16" fill="white" stroke="#D5DED7"/><text x="928" y="180" font-family="Arial, sans-serif" font-size="23" fill="#203D37" font-weight="700">04 / Interromper</text><text x="928" y="218" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E03 · E07</text><text x="928" y="262" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Perder horário ou mudar</text><text x="928" y="288" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">a rotina.</text><text x="928" y="361" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="700">Hipótese de oportunidade</text><text x="928" y="398" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Preservar a atividade e</text><text x="928" y="424" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">explicar opções.</text><rect x="1200" y="140" width="270" height="350" rx="16" fill="white" stroke="#D5DED7"/><text x="1218" y="180" font-family="Arial, sans-serif" font-size="23" fill="#203D37" font-weight="700">05 / Retomar</text><text x="1218" y="218" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E04 · E08</text><text x="1218" y="262" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Reagendar ou continuar a</text><text x="1218" y="288" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">sequência.</text><text x="1218" y="361" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="700">Hipótese de oportunidade</text><text x="1218" y="398" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Explorar remarcação ou</text><text x="1218" y="424" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">fila flexível.</text><text x="40" y="540" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Sem atribuição de emoções, tempos, taxas de sucesso ou melhorias não medidas.</text><text x="40" y="578" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Perfis A e B e limites detalhados: relatorio-final.md.</text></svg>