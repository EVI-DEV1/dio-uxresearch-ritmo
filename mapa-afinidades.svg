<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><title>Ritmo — mapa de afinidades documental</title><rect width="1400" height="640" fill="#F7F5F0"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="32" fill="#203D37" font-weight="700">Ritmo / mapa de afinidades</text><text x="40" y="93" font-family="Arial, sans-serif" font-size="18" fill="#203D37" font-weight="400">Síntese de documentos; não deriva de entrevistas ou testes com participantes.</text><rect x="40" y="130" width="320" height="390" rx="18" fill="#DDEDE6"/><text x="60" y="170" font-family="Arial, sans-serif" font-size="22" fill="#203D37" font-weight="700">Estrutura visível</text><text x="60" y="207" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E01 · E02 · E09</text><text x="60" y="250" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Listas, blocos e tarefas</text><text x="60" y="276" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">específicas aparecem como</text><text x="60" y="302" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">formas de organizar a</text><text x="60" y="328" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">próxima atividade.</text><text x="60" y="415" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Investigar destaque do</text><text x="60" y="441" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">próximo item.</text><rect x="380" y="130" width="320" height="390" rx="18" fill="#EFE3CF"/><text x="400" y="170" font-family="Arial, sans-serif" font-size="22" fill="#203D37" font-weight="700">Continuidade</text><text x="400" y="207" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E03 · E04 · E07 · E08</text><text x="400" y="250" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Mudanças de rotina exigem</text><text x="400" y="276" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">ajustar cargas, mover</text><text x="400" y="302" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">atividades ou retomar</text><text x="400" y="328" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">sequências.</text><text x="400" y="415" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Investigar retomada</text><text x="400" y="441" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">simples.</text><rect x="720" y="130" width="320" height="390" rx="18" fill="#E6E1EF"/><text x="740" y="170" font-family="Arial, sans-serif" font-size="22" fill="#203D37" font-weight="700">Esforço de planejar</text><text x="740" y="207" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E05 · E06 · E07 · E08</text><text x="740" y="250" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Planejamento complexo pode</text><text x="740" y="276" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">gerar esforço; há</text><text x="740" y="302" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">alternativas simples e</text><text x="740" y="328" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">preferências distintas.</text><text x="740" y="415" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Investigar configuração</text><text x="740" y="441" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">mínima.</text><rect x="1060" y="130" width="320" height="390" rx="18" fill="#DDE8EF"/><text x="1080" y="170" font-family="Arial, sans-serif" font-size="22" fill="#203D37" font-weight="700">Escopo e progresso</text><text x="1080" y="207" font-family="Arial, sans-serif" font-size="14" fill="#203D37" font-weight="400">E02 · E09 · E10</text><text x="1080" y="250" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Blocos, tarefas específicas</text><text x="1080" y="276" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">e divisão em partes apoiam</text><text x="1080" y="302" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">hipóteses de clareza e</text><text x="1080" y="328" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">acompanhamento.</text><text x="1080" y="415" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Investigar passos e</text><text x="1080" y="441" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">progresso.</text><text x="40" y="564" font-family="Arial, sans-serif" font-size="17" fill="#203D37" font-weight="400">Contrapontos: horários fixos, listas e ciclos coexistem; não há preferência universal demonstrada.</text><text x="40" y="600" font-family="Arial, sans-serif" font-size="16" fill="#203D37" font-weight="400">Fontes e evidências completas: relatorio-final.md. Oportunidades são hipóteses a avaliar.</text></svg>